name: Release

# Manual release: Actions -> Release -> Run workflow (pick the branch, usually main).
# Version = <upstream PKGMGR_VERSION>-x<N>, N = next free fork revision for that
# upstream version (tools/fork_version.sh). Tag: v<version>, e.g. v1.2.4-x3.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (leave empty for the next <upstream>-x<N>)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release (e.g. PS4 builds still untested)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      upstream: ${{ steps.v.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UP=$(bash tools/fork_version.sh upstream)
          VER="${{ inputs.version }}"
          [ -n "$VER" ] || VER=$(bash tools/fork_version.sh next)
          case "$VER" in
            "$UP"-x[0-9]*) ;;
            *) echo "::error::Version '$VER' must look like ${UP}-x<N>"; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null || gh release view "v$VER" >/dev/null 2>&1; then
            echo "::error::Release v$VER already exists"; exit 1
          fi
          echo "Releasing v$VER (upstream $UP)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "upstream=$UP" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: payload-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.version.outputs.version }}"
          UP="${{ needs.version.outputs.upstream }}"
          PREV=$(git tag -l 'v*-x*' --sort=-v:refname | head -1)
          {
            echo "PKG Manager X **v$VER**, based on [PKG Manager v$UP](https://github.com/itsPLK/ps5-pkg-manager/releases/tag/v$UP) by PLK."
            echo
            echo "| File | Console | Loader |"
            echo "|------|---------|--------|"
            echo "| \`pkg-manager-x_v${VER}_ps5.elf\` | PS5 | Payload Manager / elfldr (9021) |"
            echo "| \`pkg-manager-x_v${VER}_ps4.elf\` | PS4 (experimental, see docs/PS4.md) | GoldHEN payload loader (9090) |"
            echo
            [ -n "$PREV" ] && echo "Full changelog: https://github.com/${{ github.repository }}/compare/$PREV...v$VER"
          } > notes.md
          ls -l dist
          gh release create "v$VER" dist/*.elf \
            --target "${{ github.sha }}" \
            --title "PKG Manager X v$VER" \
            --notes-file notes.md \
            ${{ inputs.prerelease && '--prerelease' || '' }}
