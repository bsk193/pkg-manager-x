name: Build

# Host tests + PS5/PS4 payloads on every push and pull request.
# release.yml calls this workflow with the release version.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Version compiled into the payloads (e.g. 1.1.0 or 1.1.1-beta.1). Empty = dev build.'
        type: string
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}-${{ inputs.version || 'dev' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !inputs.version }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      artifact_suffix: ${{ steps.v.outputs.suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags for `git describe` (dev version)
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(bash tools/fork_version.sh dev)" >> "$GITHUB_OUTPUT"
            echo "suffix=-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Host tests (make test)
        run: make test

  frontend:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build frontend
        run: make frontend-build X_VERSION="${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  payload:
    runs-on: ubuntu-latest
    needs: [version, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ps5
            dockerfile: Dockerfile.sdk
            image: ps5-payload-sdk-pkgmgr
            elf: pkgmgr.elf
          - platform: ps4
            dockerfile: Dockerfile.sdk-ps4
            image: ps4-payload-sdk-pkgmgr
            elf: pkgmgr-ps4.elf
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: docker/setup-buildx-action@v3
      - name: SDK image (${{ matrix.platform }}, cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}
          load: true
          cache-from: type=gha,scope=sdk-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=sdk-${{ matrix.platform }}
      - name: Build ${{ matrix.platform }} payload
        run: |
          docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} \
            make all PLATFORM=${{ matrix.platform }} \
                     X_VERSION="${{ needs.version.outputs.version }}" \
                     BUILD_COMMIT="$(git rev-parse --short HEAD)"
          OUT="pkg-manager-x_v${{ needs.version.outputs.version }}${{ needs.version.outputs.artifact_suffix }}_${{ matrix.platform }}.elf"
          sudo mv "${{ matrix.elf }}" "$OUT"
          sudo chown "$(id -u):$(id -g)" "$OUT"
          ls -l "$OUT"
          echo "ELF_NAME=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.platform }}
          path: ${{ env.ELF_NAME }}
          retention-days: 30

  # PS4 home screen tile: a fake PKG (OpenOrbis toolchain) that starts the
  # bundled PS4 payload through GoldHEN's BinLoader and opens the web UI.
  ps4-tile:
    runs-on: ubuntu-latest
    needs: [version, payload]
    env:
      OO_URL: https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: payload-ps4
          path: payload
      - name: OpenOrbis toolchain (cached)
        id: oo-cache
        uses: actions/cache@v4
        with:
          path: ~/OpenOrbis
          key: openorbis-v0.5.4-llvm18
      - name: Download OpenOrbis toolchain
        if: steps.oo-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/OpenOrbis
          curl -fsSL "$OO_URL" | tar xz -C ~/OpenOrbis
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld python3-pil
          OO=$(dirname "$(find ~/OpenOrbis -name link.x -print -quit)")
          echo "Toolchain: $OO"
          chmod +x "$OO"/bin/linux/* || true
          echo "OO_PS4_TOOLCHAIN=$OO" >> "$GITHUB_ENV"
      - name: Build tile package
        run: |
          VER="${{ needs.version.outputs.version }}"
          # Package version xx.yy from x.y.z (1.2.3 -> 01.23); pre-releases share it.
          CORE="${VER%%-*}"
          IFS=. read -r MA MI PA <<< "$CORE"
          PKGVER=$(printf '%02d.%02d' "$MA" "$(( MI * 10 + PA ))")
          ELF=$(ls payload/*.elf | head -1)
          make -C ps4-launcher OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN" \
               PAYLOAD="$PWD/$ELF" VERSION="$PKGVER"
          OUT="pkg-manager-x_v${VER}${{ needs.version.outputs.artifact_suffix }}_ps4-tile.pkg"
          mv ps4-launcher/IV0000-PKGX00001_00-PKGMANAGERX00000.pkg "$OUT"
          ls -l "$OUT"
          echo "PKG_NAME=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: payload-ps4-tile
          path: ${{ env.PKG_NAME }}
          retention-days: 30
